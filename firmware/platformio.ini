; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200   ; slower but reliable — the default 460800 dropped out mid-upload
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Hardware bench test: builds ONLY examples/relay_test.cpp (ignores src/main.cpp).
;   pio run -e relay -t upload   &&   pio device monitor
[env:relay]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
build_src_filter = -<*> +<../examples/relay_test.cpp>

; Hardware bench test: valve + pump relays, driven by hand from the monitor.
;   pio run -e pump -t upload   &&   pio device monitor
[env:pump]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
build_src_filter = -<*> +<../examples/pump_test.cpp>

; Hardware bench test: builds ONLY examples/flow_test.cpp (ignores src/main.cpp).
;   pio run -e flow -t upload   &&   pio device monitor
[env:flow]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
build_src_filter = -<*> +<../examples/flow_test.cpp>

; Connectivity probe: is anything wired to a pin? Builds examples/pin_probe.cpp.
;   pio run -e probe -t upload   &&   pio device monitor
[env:probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
build_src_filter = -<*> +<../examples/pin_probe.cpp>